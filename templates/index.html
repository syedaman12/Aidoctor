<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Doctor Chatbot</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Poppins', sans-serif;
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: flex-start; /* sidebar sticks to the left */
    align-items: stretch;         /* full height */
    background: linear-gradient(135deg, #701f1f 0%, #21498d 100%);
    padding: 20px;
}

#container {
    display: flex;
    width: 100%;
    max-width: 1400px;
    height: 85%;
    gap: 20px;
    margin: 0 auto; /* centers container if smaller than viewport */
}

/* Sidebar */
#sidebar {
    width: 280px;
    flex-shrink: 0;
    height: 100%;
    overflow-y: auto;
    background: rgba(255,255,255,0.15);
    border-radius: 15px;
    padding: 20px;
    backdrop-filter: blur(15px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
}
#sidebar h3 {
    text-align: center;
    color: #fff;
    margin-bottom: 20px;
    font-size: 22px;
    font-weight: bold;
}
.conv-btn {
    display: block;
    padding: 12px;
    margin: 10px 0;
    background: rgb(255, 255, 255);
    cursor: pointer;
    border-radius: 12px;
    text-align: center;
    font-size: 14px;
    color: #6a11cb;
    font-weight: bold;
    transition: all 0.3s ease;
}
.conv-btn:hover {
    background: rgba(255, 255, 255, 0.4);
}
.conv-btn.active {
    background: #ffffff;
    color: #6a11cb;
    font-weight: bold;
}
#sidebar button {
    margin-top: auto;
    padding: 14px;
    background: #ffffff;
    color: #6a11cb;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}
#sidebar button:hover {
    background: #f0f0f0;
}

/* Chat Box */
#chat-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    background: rgba(255,255,255,0.15);
    border-radius: 15px;
    padding: 20px;
    backdrop-filter: blur(15px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

/* Chat Messages */
#chat {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    background: rgba(255,255,255,0.35);
    border-radius: 15px;
    margin-bottom: 15px;
}
.user {
    background: #92e8a5;
    color: #000;
    padding: 12px 16px;
    margin: 10px 0;
    border-radius: 18px 18px 0 18px;
    max-width: 70%;
    align-self: flex-end;
    font-size: 14px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);
}
.bot {
    background: #ffffff;
    color: #333;
    padding: 12px 16px;
    margin: 10px 0;
    border-radius: 18px 18px 18px 0;
    max-width: 75%;
    align-self: flex-start;
    font-size: 14px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);
}
.section {
    margin-top: 6px;
    font-size: 13px;
    color: #555;
}

/* Input Area */
#input-container {
    display: flex;
    gap: 10px;
}
#input-container input[type="text"] {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 14px;
    outline: none;
    background: rgba(255, 255, 255, 0.85);
}
#input-container button {
    padding: 14px 20px;
    background: #28a745;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}
#input-container button:active {
    background: #1e7e34; /* dark green on click */
}

/* Scrollbar Styling */
#chat::-webkit-scrollbar, #sidebar::-webkit-scrollbar {
    width: 8px;
}
#chat::-webkit-scrollbar-thumb, #sidebar::-webkit-scrollbar-thumb {
    background-color: #0d0d0e;
    border-radius: 4px;
}
</style>
</head>
<body>

<div id="container">
    <!-- Sidebar -->
    <div id="sidebar">
        <h3>AI Doctor chatbot</h3>
        <h4 style="color: #f4eded; text-align: center; margin-top: -10px; font-weight: normal; font-size: 14px;">How can I assist you today?</h4>
        <div id="conv-list"></div>
        <button onclick="newConversation()">+ New Conversation</button>
    </div>

    <!-- Chat Box -->
    <div id="chat-box">
        <div id="chat"></div>
        <div id="input-container">
            <input type="text" id="message" placeholder="Type your symptoms...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>
let conversations = [];
let currentConv = 0;
const chat = document.getElementById("chat");
const convList = document.getElementById("conv-list");

function renderConversations() {
    convList.innerHTML = "";
    conversations.forEach((conv, index) => {
        const btn = document.createElement("div");
        btn.className = "conv-btn" + (index === currentConv ? " active" : "");
        btn.innerText = "Conversation " + (index + 1);
        btn.onclick = () => { currentConv = index; renderChat(); renderConversations(); };
        convList.appendChild(btn);
    });
}

function renderChat() {
    chat.innerHTML = "";
    if(conversations[currentConv]){
        conversations[currentConv].forEach(msg => {
            if(msg.role === "user"){
                chat.innerHTML += `<div class="user">${msg.content}</div>`;
            } else if(msg.role === "assistant"){
                let html = `<div class="bot"><b>Hello I'm AI Doctor:</b>`;
                const sections = ["Symptoms","Possible Causes","Recommended Tests","Advice"];
                sections.forEach(s => {
                    const regex = new RegExp(s+":\\s*([\\s\\S]*?)(?=(Symptoms|Possible Causes|Recommended Tests|Advice|$))","i");
                    const match = msg.content.match(regex);
                    if(match) html += `<div class="section"><b>${s}:</b> ${match[1].trim()}</div>`;
                });
                html += `</div>`;
                chat.innerHTML += html;
            }
        });
    }
    chat.scrollTop = chat.scrollHeight;
}

function newConversation(){
    conversations.push([]);
    currentConv = conversations.length - 1;
    renderConversations();
    renderChat();
}

async function sendMessage(){
    const msgBox = document.getElementById("message");
    const message = msgBox.value;
    if(!message) return;

    if(!conversations[currentConv]) conversations[currentConv] = [];
    conversations[currentConv].push({role:"user", content:message});
    renderChat();
    msgBox.value = "";

    const response = await fetch("/ask", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({message: message, conv_id: currentConv})
    });
    const data = await response.json();
    conversations[currentConv].push({role:"assistant", content:data.answer});
    renderChat();
    renderConversations();
}

renderConversations();
renderChat();
</script>

</body>
</html>
